name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that dist/ is committed and up to date
        run: git diff --exit-code -- dist

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secure rules pass
        uses: ./
        with:
          files: examples/secure.rules
      - name: Insecure rules fail with exit code 1
        run: |
          set +e
          node dist/cli.js examples/insecure.rules
          test $? -eq 1
